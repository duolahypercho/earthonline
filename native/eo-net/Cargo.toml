[package]
name = "eo-net"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Earth Online online foundation: UDP transport with its own reliability and ordering, the session handshake, snapshot replication (interest, delta compression, quantisation, bandwidth budget), client prediction, reconciliation and interpolation (no GPU)"
publish = false

[dependencies]
anyhow = "1.0.104"
eo-assets = { path = "../eo-assets" }
eo-data = { path = "../eo-data" }
eo-landmarks = { path = "../eo-landmarks" } # landmark access: the decks a server and its clients share
eo-player = { path = "../eo-player" }
eo-sky = { path = "../eo-sky" }
eo-structures = { path = "../eo-structures" } # structures: the handshake's world setting
eo-street = { path = "../eo-street" } # street tapers: the handshake's world setting (`--street-tapers`)
glam = "0.34.3"
serde = { version = "1.0.229", features = ["derive"] } # the landmark viewpoint table
serde_json = "1.0.154"
